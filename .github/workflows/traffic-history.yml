name: GitHub Traffic History

on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically every day at midnight UTC
  workflow_dispatch: # Allows you to trigger the workflow manually at any time

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch GitHub Traffic Data
        uses: platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
        env:
          GITHUB_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}

      - name: Ensure Target Directory Exists
        run: mkdir -p Documentation/traffic

      - name: Commit and Push Traffic Data to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add Documentation/traffic/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update traffic statistics [skip ci]" && git push)
