name: GitHub Traffic History

on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically every day at midnight UTC
  workflow_dispatch: # Allows you to trigger the workflow manually at any time

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch and Save Real Clone Data
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          mkdir -p .traffic

          # Fetch clones data from official GitHub API
          curl -s -H "Authorization: token $TRAFFIC_TOKEN" \
               -H "Accept: application/vnd.github.v3+json" \
               https://github.com{{ github.repository }}/traffic/clones \
               > .traffic/clones.json

          # Fetch views data from official GitHub API
          curl -s -H "Authorization: token $TRAFFIC_TOKEN" \
               -H "Accept: application/vnd.github.v3+json" \
               https://github.com{{ github.repository }}/traffic/views \
               > .traffic/clones_views.json

      - name: Commit and Push Traffic Data to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .traffic/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update repository traffic analytics [skip ci]" && git push)
