name: GitHub Traffic History

on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically every day at midnight UTC
  workflow_dispatch: # Allows you to trigger the workflow manually at any time

# Grant the corporate GitHub Actions bot permission to write changes back to the repository
permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch GitHub Traffic Data
        uses: platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
        env:
          GITHUB_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}

      - name: Ensure Hidden Root Directory Exists
        run: mkdir -p .traffic

      - name: Move Traffic Data to Hidden Root Folder
        run: |
          if [ -d "Documentation/traffic" ]; then
            cp -r Documentation/traffic/* .traffic/
            rm -rf Documentation
          fi

      - name: Commit and Push Traffic Data to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .traffic/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update repository traffic analytics [skip ci]" && git push)
