name: GitHub Traffic History

on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically every day at midnight UTC
  workflow_dispatch: # Allows you to trigger the workflow manually at any time

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch and Merge Traffic Data
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p .traffic

          for t in clones views; do
            # Fetch the last 14 days from the official GitHub API endpoint
            curl -sSf -H "Authorization: Bearer $TRAFFIC_TOKEN" \
                 -H "Accept: application/vnd.github+json" \
                 "https://api.github.com/repos/$REPO/traffic/$t" \
                 -o "$RUNNER_TEMP/$t.json"

            f=".traffic/${t}_history.json"
            [ -f "$f" ] || echo '[]' > "$f"

            # Merge by day: new values win, older days are kept, sorted by date
            jq -s --arg k "$t" '(.[1][$k] + .[0]) | unique_by(.timestamp)' \
               "$f" "$RUNNER_TEMP/$t.json" > "$RUNNER_TEMP/merged.json"
            mv "$RUNNER_TEMP/merged.json" "$f"
          done

      - name: Commit and Push Traffic Data to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .traffic/
          git diff --staged --quiet || (git commit -m "chore: update repository traffic analytics [skip ci]" && git push)
